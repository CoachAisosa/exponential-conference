<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exponential Conference 2026</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- ✅ NETLIFY FORM BLUEPRINTS (hidden) -->
    <!-- These are required for Netlify to detect and process your forms -->
    <div style="display: none;">
      
      <!-- Registration Form Blueprint -->
      <form name="registration" netlify netlify-honeypot="bot-field" hidden>
        <input type="text" name="fullName" />
        <input type="email" name="email" />
        <input type="tel" name="phone" />
        <input type="text" name="country" />
        <input type="text" name="state" />
        <input type="text" name="city" />
        <input type="text" name="churchOrganisation" />
        <input type="text" name="leadershipRole" />
        <select name="registrationCategory">
          <option value="individual">Individual Registration</option>
          <option value="church-group">Church / Group Registration</option>
          <option value="minister-pastor">Minister / Pastor Registration</option>
          <option value="student-emerging-leader">Student / Emerging Leader Registration</option>
        </select>
        <textarea name="message"></textarea>
        <input type="text" name="bot-field" />
      </form>

      <!-- Contact Form Blueprint -->
      <form name="contact" netlify netlify-honeypot="bot-field" hidden>
        <input type="text" name="fullName" />
        <input type="email" name="email" />
        <input type="tel" name="phone" />
        <select name="subject">
          <option value="registration">Registration</option>
          <option value="programme">Programme</option>
          <option value="speakers">Speakers</option>
          <option value="accommodation">Accommodation</option>
          <option value="travel">Travel</option>
          <option value="partnership">Partnership</option>
          <option value="sponsorship">Sponsorship</option>
          <option value="media">Media</option>
          <option value="general-enquiry">General Enquiry</option>
          <option value="other">Other</option>
        </select>
        <textarea name="message"></textarea>
        <input type="text" name="bot-field" />
      </form>

    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
